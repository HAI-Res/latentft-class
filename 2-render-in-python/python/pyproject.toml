[project]
name = "latentft-lab"
version = "0.3.0"
description = "Client and pictures for the LatentFT class service (HAI-Res, MIT): render with per-bin rate masks, blends and the raw latent, on the lab GPU or your own"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "soundfile>=0.12", "librosa>=0.10"]

[project.optional-dependencies]
viz = ["matplotlib>=3.7", "ipython>=8", "ipywidgets>=8"]

[project.scripts]
latentft-sweep = "latentft_sweep:main"

[project.urls]
Homepage = "https://latentft.csail.mit.edu/notebook/"
Documentation = "https://latentft.csail.mit.edu/notebook/client.html"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/latentft_lab"]
# the two modules are also importable by their old names (from latentft_client import ..., from latentft_viz import ...)
only-include = ["src/latentft_lab", "src/latentft_client.py", "src/latentft_viz.py", "src/latentft_sweep.py"]
sources = ["src"]
